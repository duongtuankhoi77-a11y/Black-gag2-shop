<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLACK GAG2 SHOP</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#080a13;
  color:#fff;
  font-family:Arial,sans-serif
}
.wrap{
  max-width:1100px;
  margin:auto;
  padding:18px 16px 100px
}
header{
  position:sticky;
  top:0;
  z-index:5;
  background:#0b0d18ee;
  border-bottom:1px solid #292d48
}
.nav{
  max-width:1100px;
  margin:auto;
  padding:13px 16px;
  display:flex;
  gap:8px;
  align-items:center
}
.logo{
  font-size:20px;
  font-weight:900;
  margin-right:auto
}
.logo span{color:#8b6cff}

button{
  border:0;
  border-radius:11px;
  padding:11px 14px;
  cursor:pointer;
  font-weight:800
}
.primary{
  background:linear-gradient(100deg,#6657ff,#aa5cff);
  color:#fff
}
.dark{
  background:#171a2c;
  color:#fff;
  border:1px solid #303451
}
.danger{
  background:#3b1820;
  color:#fff
}

.hero,.panel,.card{
  background:#10121e;
  border:1px solid #292d48;
  border-radius:20px
}
.hero{
  padding:35px;
  background:radial-gradient(
    circle at 85% 15%,
    #4c2c86,
    #15162a 40%,
    #10121e 72%
  )
}
.hero h1{
  font-size:clamp(40px,8vw,70px);
  line-height:1;
  margin:18px 0
}
.grad{
  background:linear-gradient(90deg,#7667ff,#d96cff);
  -webkit-background-clip:text;
  color:transparent
}
.muted{color:#989db7}
.tag{
  display:inline-block;
  background:#1a1d31;
  color:#a49aff;
  padding:6px 9px;
  border-radius:8px;
  font-size:12px
}
.section{margin-top:25px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:13px
}
.card{padding:16px}
.product-img{width:100%;height:170px;object-fit:cover;border-radius:14px;border:1px solid #292d48;margin-bottom:10px;background:#0b0d17}
.admin-img{width:58px;height:58px;object-fit:cover;border-radius:10px;border:1px solid #303451;background:#0b0d17}
.qr-box{text-align:center;padding:15px;background:#0b0d17;border:1px solid #303451;border-radius:16px;margin-top:12px}
.qr-box img{width:min(260px,100%);max-width:260px;border-radius:12px;background:#fff}
.amount-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.amount-grid button{width:100%}
.admin-form{background:#0b0d17;border:1px solid #303451;border-radius:14px;padding:14px;margin:10px 0 16px}
.price{
  font-size:19px;
  font-weight:900;
  margin:12px 0
}
input,select{
  width:100%;
  padding:12px;
  margin:6px 0 12px;
  border-radius:10px;
  border:1px solid #303451;
  background:#0b0d17;
  color:#fff
}
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #292d48
}
.hide{display:none!important}

.modal{
  position:fixed;
  inset:0;
  background:#000b;
  z-index:30;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px
}
.modal.show{display:flex}
.modalbox{
  width:min(480px,100%);
  background:#111426;
  border:1px solid #383c64;
  border-radius:20px;
  padding:20px
}

.bottom{
  position:fixed;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  width:min(720px,calc(100% - 24px));
  z-index:10;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
  padding:7px;
  border:1px solid #292d48;
  border-radius:18px;
  background:#0d0f1af5
}
.bottom button{
  background:transparent;
  color:#aeb3ca
}
.bottom .on{
  background:#29214e;
  color:#fff
}
.admin{
  border-color:#6f5cff
}

@media(max-width:600px){
  .nav .logo{
    font-size:16px
  }
  .nav #hello{
    display:none
  }
  .nav button{
    padding:9px
  }
  .bottom{
    grid-template-columns:repeat(5,1fr)
  }
  .bottom button{
    padding:8px 3px;
    font-size:11px
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">

    <div class="logo">
      🎮 <span>BLACK</span> GAG2 SHOP
    </div>

    <span id="hello" class="muted"></span>

    <button
      id="loginBtn"
      class="dark"
      onclick="modal('login')">
      Đăng nhập
    </button>

    <button
      id="regBtn"
      class="primary"
      onclick="modal('register')">
      Đăng ký
    </button>

    <button
      id="logoutBtn"
      class="dark hide"
      onclick="logout()">
      Đăng xuất
    </button>

  </div>
</header>

<main class="wrap">

<section class="hero">
  <span class="tag">GROW A GARDEN 2</span>

  <h1>
    Mua bán GAG2<br>
    <span class="grad">nhanh & tiện</span>
  </h1>

  <p class="muted">
    BLACK GAG2 SHOP — chỉ có Grow a Garden 2.
  </p>

  <button
    class="primary"
    onclick="scrollToId('products')">
    🛒 Xem sản phẩm
  </button>
</section>


<!-- =========================
     SẢN PHẨM
========================= -->

<section id="products" class="section">

  <h2>🌱 Sản phẩm</h2>

  <div id="productGrid" class="grid"></div>

</section>


<!-- =========================
     NẠP TIỀN
========================= -->

<section id="topupSection" class="section">

  <div class="panel" style="padding:20px">

    <h2>💰 Nạp tiền</h2>

    <button
      class="dark"
      onclick="topupCard()">
      💳 Thẻ cào
    </button>

    <button
      class="dark"
      onclick="topupBank()">
      🏦 Bank
    </button>

    <p id="topupMsg" class="muted"></p>

  </div>

</section>


<!-- =========================
     ĐƠN HÀNG
========================= -->

<section id="ordersSection" class="section">

  <div class="panel" style="padding:20px">

    <h2>📦 Đơn hàng</h2>

    <div id="orders"></div>

  </div>

</section>


<!-- =========================
     HỒ SƠ
========================= -->

<section id="profileSection" class="section">

  <div class="panel" style="padding:20px">

    <h2>👤 Hồ sơ</h2>

    <div id="profile">

      <p class="muted">
        Đăng nhập để xem hồ sơ.
      </p>

    </div>

  </div>

</section>


<!-- =========================
     ADMIN
     USER KHÔNG THẤY
========================= -->

<section
  id="adminSection"
  class="section hide">

  <div
    class="panel admin"
    style="padding:20px">

    <h2>👑 Admin</h2>

    <div id="admin"></div>

  </div>

</section>

</main>


<!-- =========================
     THANH DƯỚI
========================= -->

<nav class="bottom">

  <button
    id="navShop"
    class="on"
    onclick="scrollToId('products')">
    🏠<br>Shop
  </button>

  <button
    id="navTopup"
    onclick="topupCard()">
    💳<br>Nạp tiền
  </button>

  <button
    id="navOrders"
    onclick="loadOrders();scrollToId('ordersSection')">
    ☷<br>Đơn hàng
  </button>

  <button
    id="navProfile"
    onclick="scrollToId('profileSection')">
    👤<br>Hồ sơ
  </button>

  <!-- CHỈ ADMIN MỚI THẤY -->
  <button
    id="navAdmin"
    class="hide"
    onclick="adminLogin()">
    👑<br>Admin
  </button>

</nav>


<!-- =========================
     MODAL
========================= -->

<div
  class="modal"
  id="modal">

  <div
    class="modalbox"
    id="modalbox">
  </div>

</div>


<script>

let token =
  localStorage.getItem("black_token") || "";

let products = [];
let cart = [];

const $ = id =>
  document.getElementById(id);

const money = n =>
  Number(n).toLocaleString("vi-VN") + "đ";


/* =========================
   API
========================= */

async function api(url,opt={}){

  opt.headers = {
    ...(opt.headers || {}),
    ...(token
      ? {Authorization:"Bearer "+token}
      : {})
  };

  if(
    opt.body &&
    typeof opt.body !== "string"
  ){
    opt.headers["Content-Type"] =
      "application/json";

    opt.body =
      JSON.stringify(opt.body);
  }

  const r =
    await fetch(url,opt);

  const d =
    await r.json().catch(() => ({}));

  if(!r.ok){
    throw Error(
      d.error || "Có lỗi"
    );
  }

  return d;
}


/* =========================
   SẢN PHẨM
========================= */

async function loadProducts(){

  products =
    await api("/api/products");

  $("productGrid").innerHTML =
    products.map(p => `

      <div class="card">

        ${p.image ? `<img class="product-img" src="${p.image}" alt="">` : ""}

        <span class="tag">
          GAG2
        </span>

        <h3>${p.name}</h3>

        <div class="muted">
          Grow a Garden 2
        </div>

        <div class="price">
          ${money(p.price)} / 1
        </div>

        <button
          class="dark"
          onclick="buy(${p.id})">
          🛒 Thêm giỏ
        </button>

        <button
          class="primary"
          onclick="buy(${p.id},true)">
          ⚡ Mua ngay
        </button>

      </div>

    `).join("");
}


/* =========================
   MODAL
========================= */

function modal(type){

  $("modalbox").innerHTML =
    type === "login"

    ? `

      <h2>🔐 Đăng nhập</h2>

      <input
        id="login"
        placeholder="Tên đăng nhập hoặc Email">

      <input
        id="pass"
        type="password"
        placeholder="Mật khẩu">

      <button
        class="primary"
        style="width:100%"
        onclick="doLogin()">
        Đăng nhập
      </button>

      <p class="muted">
        Chưa có tài khoản?
        <a
          href="#"
          onclick="modal('register');return false">
          Đăng ký
        </a>
      </p>

    `

    : `

      <h2>👤 Đăng ký</h2>

      <input
        id="user"
        placeholder="Tên đăng nhập">

      <input
        id="contact"
        placeholder="Số điện thoại hoặc Email">

      <input
        id="pass"
        type="password"
        placeholder="Mật khẩu">

      <button
        class="primary"
        style="width:100%"
        onclick="doRegister()">
        Tạo tài khoản
      </button>

      <p class="muted">
        Không cần OTP.
      </p>

    `;

  $("modal").classList.add("show");
}


function close(){
  $("modal").classList.remove("show");
}


/* =========================
   ĐĂNG KÝ
========================= */

async function doRegister(){

  try{

    let d =
      await api("/api/register",{
        method:"POST",
        body:{
          username:$("user").value,
          contact:$("contact").value,
          password:$("pass").value
        }
      });

    token = d.token;

    localStorage.setItem(
      "black_token",
      token
    );

    close();

    refresh();

  }catch(e){

    alert(e.message);

  }
}


/* =========================
   ĐĂNG NHẬP
========================= */

async function doLogin(){

  try{

    let d =
      await api("/api/login",{
        method:"POST",
        body:{
          login:$("login").value,
          password:$("pass").value
        }
      });

    token = d.token;

    localStorage.setItem(
      "black_token",
      token
    );

    close();

    refresh();

  }catch(e){

    alert(e.message);

  }
}


/* =========================
   LOGOUT
========================= */

async function logout(){

  try{

    if(token){
      await api(
        "/api/logout",
        {method:"POST"}
      );
    }

  }catch(e){}

  token = "";

  localStorage.removeItem(
    "black_token"
  );

  $("hello").textContent = "";

  $("loginBtn")
    .classList.remove("hide");

  $("regBtn")
    .classList.remove("hide");

  $("logoutBtn")
    .classList.add("hide");

  $("adminSection")
    .classList.add("hide");

  $("navAdmin")
    .classList.add("hide");

  $("profile").innerHTML = `
    <p class="muted">
      Đăng nhập để xem hồ sơ.
    </p>
  `;

  loadOrders();
}


/* =========================
   REFRESH
========================= */

async function refresh(){

  try{

    let u =
      await api("/api/me");

    $("hello").textContent =
      `👤 ${u.username} · ${money(u.balance)}`;

    $("loginBtn")
      .classList.add("hide");

    $("regBtn")
      .classList.add("hide");

    $("logoutBtn")
      .classList.remove("hide");


    /* HỒ SƠ */

    $("profile").innerHTML = `

      <div class="row">
        <span>Tài khoản</span>
        <b>${u.username}</b>
      </div>

      <div class="row">
        <span>Liên hệ</span>
        <b>${u.contact}</b>
      </div>

      <div class="row">
        <span>Số dư</span>
        <b>${money(u.balance)}</b>
      </div>

      <div class="row">
        <span>Quyền</span>
        <b>
          ${u.role === "admin"
            ? "👑 ADMIN"
            : "👤 USER"}
        </b>
      </div>

      <br>

      <button
        class="danger"
        onclick="logout()">
        Đăng xuất
      </button>

    `;


    /* =====================
       ADMIN
    ===================== */

    if(u.role === "admin"){

      $("adminSection")
        .classList.remove("hide");

      $("navAdmin")
        .classList.remove("hide");

      loadAdmin();

    }else{

      /* USER KHÔNG THẤY ADMIN */

      $("adminSection")
        .classList.add("hide");

      $("navAdmin")
        .classList.add("hide");

    }

    loadOrders();

  }catch(e){

    logout();

  }
}


/* =========================
   MUA
========================= */

function buy(id,now=false){

  if(!token){
    modal("login");
    return;
  }

  const p = products.find(x => x.id === id);
  if(!p){
    alert("Không tìm thấy sản phẩm.");
    return;
  }

  let qty = 1;

  $("modalbox").innerHTML = `
    <div style="padding:5px">
      <h3>🛒 Mua ${p.name}</h3>

      <div style="margin:15px 0">
        <b>Số lượng</b>
        <div style="display:flex;align-items:center;justify-content:center;gap:18px;margin-top:10px">
          <button class="dark" id="qtyMinus" style="width:45px;height:45px;font-size:22px">−</button>
          <strong id="qtyValue" style="font-size:22px;min-width:35px;text-align:center">1</strong>
          <button class="dark" id="qtyPlus" style="width:45px;height:45px;font-size:22px">+</button>
        </div>
      </div>

      <div style="margin-top:15px">
        <b>🎮 Tên tài khoản game</b>
        <input id="gameUsername" type="text" placeholder="Nhập tên tài khoản game" autocomplete="off" style="margin-top:8px">
      </div>

      <p class="muted" style="margin-top:12px">
        Tổng tiền: <b id="buyTotal">${money(p.price)}</b>
      </p>

      <button class="primary" id="confirmBuy" style="width:100%;margin-top:8px">Xác nhận mua</button>
      <button class="dark" id="cancelBuy" style="width:100%;margin-top:8px">Hủy</button>
    </div>
  `;

  $("modal").classList.add("show");

  function updateQty(){
    $("qtyValue").textContent = qty;
    $("buyTotal").textContent = money(p.price * qty);
  }

  $("qtyMinus").onclick = () => {
    if(qty > 1){
      qty--;
      updateQty();
    }
  };

  $("qtyPlus").onclick = () => {
    if(p.stock > 0 && qty >= p.stock){
      alert("Không đủ hàng.");
      return;
    }
    qty++;
    updateQty();
  };

  $("cancelBuy").onclick = () => close();

  $("confirmBuy").onclick = () => {
    const gameUsername = $("gameUsername").value.trim();
    if(!gameUsername){
      alert("Vui lòng nhập tên tài khoản game.");
      $("gameUsername").focus();
      return;
    }

    checkout([{productId:id,qty:qty}],gameUsername);
  };
}


/* =========================
   CHECKOUT
========================= */

async function checkout(items,gameUsername){

  if(!gameUsername){
    alert("Vui lòng nhập tên tài khoản game.");
    return;
  }

  try{
    let d = await api("/api/orders",{
      method:"POST",
      body:{items,gameUsername}
    });

    alert("Đặt hàng thành công. Mã đơn #" + d.orderId);
    close();
    cart = [];
    refresh();
  }catch(e){
    alert(e.message);
  }
}


/* =========================
   ĐƠN HÀNG
========================= */

async function loadOrders(){

  if(!token){

    $("orders").innerHTML =
      '<p class="muted">Đăng nhập để xem đơn hàng.</p>';

    return;
  }

  try{

    let a =
      await api("/api/orders");

    $("orders").innerHTML =
      a.map(o => `

        <div class="row">

          <span>
            #${o.id} · ${o.items}
            <br>
            <small class="muted">
              ${o.status}
            </small>
          </span>

          <b>
            ${money(o.total)}
          </b>

        </div>

      `).join("")

      ||

      '<p class="muted">Chưa có đơn.</p>';

  }catch(e){}

}


/* =========================
   NẠP THẺ
========================= */

function topupCard(){

  if(!token){

    modal("login");

    return;
  }

  $("topupMsg").innerHTML = `

    <div
      class="panel"
      style="padding:15px">

      <h3>💳 Nạp thẻ cào</h3>

      <p class="muted">
        Chiết khấu 16%
      </p>

      <select id="cp">

        <option>
          Viettel
        </option>

        <option>
          Vinaphone
        </option>

        <option>
          Mobifone
        </option>

      </select>

      <select id="cv">

        ${[
          10000,
          20000,
          50000,
          100000,
          200000,
          500000
        ].map(x => `

          <option value="${x}">
            ${money(x)}
          </option>

        `).join("")}

      </select>

      <input
        id="cs"
        placeholder="Serial">

      <input
        id="cc"
        placeholder="Mã thẻ">

      <button
        class="primary"
        onclick="sendCard()">
        Gửi thẻ
      </button>

      <p class="muted">
        Admin sẽ kiểm tra thẻ rồi duyệt tiền.
      </p>

    </div>

  `;
}


/* =========================
   GỬI THẺ
========================= */

async function sendCard(){

  try{

    await api(
      "/api/topups/card",
      {
        method:"POST",
        body:{
          provider:$("cp").value,
          value:Number(
            $("cv").value
          ),
          serial:$("cs").value,
          code:$("cc").value
        }
      }
    );

    alert(
      "Đã gửi thẻ. Vui lòng chờ Admin kiểm tra."
    );

    $("topupMsg").textContent = "";

  }catch(e){

    alert(e.message);

  }
}


/* =========================
   BANK
========================= */

function topupBank(){
  if(!token){
    modal("login");
    return;

function selectBankAmount(amount){
  amount = Number(amount);
  const qr = window.bankQrs?.[amount];
  if(!qr){
    alert("Không có QR cho mức tiền này.");
    return;
  }

  $("bankQrBox").innerHTML = `
    <img src="${qr}" alt="QR ZaloPay ${money(amount)}">
    <h3 style="margin:10px 0 4px">${money(amount)}</h3>
    <p class="muted" style="margin:0 0 12px">Quét đúng QR ${money(amount)} để thanh toán.</p>
    <button class="primary" onclick="createBankTopup(${amount})">Tôi đã chuyển ${money(amount)}</button>
  `;
}

async function createBankTopup(amount){
  try{
    await api("/api/topups/bank",{method:"POST",body:{amount:Number(amount)}});
    alert("Đã tạo yêu cầu nạp Bank/ZaloPay.");
    $("topupMsg").innerHTML = "";
  }catch(e){
    alert(e.message);
  }
}


/* =========================
   ADMIN
========================= */

async function adminLogin(){

  if(!token){

    modal("login");

    return;
  }

  try{

    let me =
      await api("/api/me");

    if(me.role !== "admin"){

      alert(
        "Tài khoản không có quyền Admin."
      );

      return;
    }

    $("adminSection")
      .classList.remove("hide");

    loadAdmin();

    $("adminSection")
      .scrollIntoView({
        behavior:"smooth"
      });

  }catch(e){

    alert(e.message);

  }
}

                value="PENDING"
                ${o.status==="PENDING"?"selected":""}>
                Chờ xử lý
              </option>

              <option
                value="PROCESSING"
                ${o.status==="PROCESSING"?"selected":""}>
                Đang xử lý
              </option>

              <option
                value="COMPLETED"
                ${o.status==="COMPLETED"?"selected":""}>
                Hoàn thành
              </option>

              <option
                value="CANCELLED"
                ${o.status==="CANCELLED"?"selected":""}>
                Đã hủy
              </option>

            </select>

          </div>

        `).join("")
      }

    `;

  }catch(e){

    $("admin").textContent =
      e.message;

  }
}


/* =========================
   DUYỆT NẠP
========================= */

async function approve(id){

    await api(
      "/api/admin/topups/"+id+"/approve",

        method:"POST"
      }
    );

    );

  }

/* =========================
   SỬA SẢN PHẨM
========================= */

function openProductForm(product=null){
  const isEdit=!!product;
  $("modalbox").innerHTML=`
    <h2>${isEdit ? "✏️ Sửa sản phẩm" : "➕ Thêm sản phẩm"}</h2>
    <input id="pfName" placeholder="Tên sản phẩm" value="${isEdit ? product.name.replace(/"/g,'&quot;') : ""}">
    <input id="pfPrice" type="number" min="1" placeholder="Giá (đ)" value="${isEdit ? product.price : ""}">
    <input id="pfStock" type="number" min="0" placeholder="Tồn kho (0 = không giới hạn)" value="${isEdit ? product.stock : 0}">
    <label class="muted">Ảnh sản phẩm</label>
    <input id="pfImage" type="file" accept="image/*" onchange="previewProductImage(this)">
    <img id="pfPreview" class="product-img" style="display:${isEdit && product.image ? "block" : "none"};height:180px" src="${isEdit ? (product.image || "") : ""}" alt="Xem trước">
    <button class="primary" style="width:100%" onclick="saveProduct(${isEdit ? product.id : "null"})">${isEdit ? "Lưu thay đổi" : "Thêm sản phẩm"}</button>
    <button class="dark" style="width:100%;margin-top:8px" onclick="close()">Hủy</button>
  `;
  $("modal").classList.add("show");
}

function previewProductImage(input){
  const file=input.files?.[0];
  if(!file)return;
  if(file.size>2*1024*1024){alert("Ảnh tối đa 2MB.");input.value="";return;}
  const reader=new FileReader();
  reader.onload=()=>{$("pfPreview").src=reader.result;$("pfPreview").style.display="block";};
  reader.readAsDataURL(file);
}

async function saveProduct(id){
  const n=$("pfName").value.trim();
  const p=Number($("pfPrice").value);
  const s=Number($("pfStock").value||0);
  const file=$("pfImage").files?.[0];
  if(!n||!Number.isFinite(p)||p<=0){alert("Nhập tên và giá hợp lệ.");return;}
  if(!Number.isFinite(s)||s<0){alert("Tồn kho không hợp lệ.");return;}
  let image;
  if(file){
    if(file.size>2*1024*1024){alert("Ảnh tối đa 2MB.");return;}
    image=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});
  }
  try{
    await api(id===null?"/api/admin/products":"/api/admin/products/"+id,{method:id===null?"POST":"PATCH",body:{name:n,price:p,stock:s,...(image!==undefined?{image}:{})}});
    close();await loadProducts();await loadAdmin();
    alert(id===null?"Đã thêm sản phẩm.":"Đã sửa sản phẩm.");
  }catch(e){alert(e.message);}
}

async function editProduct(id,name,price,stock,image){
  openProductForm({id,name,price,stock,image});
}

========================= */

loadProducts();

if(token){
