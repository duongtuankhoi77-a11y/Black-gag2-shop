<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLACK GAG2 SHOP</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080a13;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:18px 16px 100px}
header{position:sticky;top:0;z-index:5;background:#0b0d18ee;border-bottom:1px solid #292d48}
.nav{max-width:1100px;margin:auto;padding:13px 16px;display:flex;gap:8px;align-items:center}
.logo{font-size:20px;font-weight:900;margin-right:auto}.logo span{color:#8b6cff}
button{border:0;border-radius:11px;padding:11px 14px;cursor:pointer;font-weight:800}
.primary{background:linear-gradient(100deg,#6657ff,#aa5cff);color:#fff}
.dark{background:#171a2c;color:#fff;border:1px solid #303451}
.danger{background:#3b1820;color:#fff}
.hero,.panel,.card{background:#10121e;border:1px solid #292d48;border-radius:20px}
.hero{padding:35px;background:radial-gradient(circle at 85% 15%,#4c2c86,#15162a 40%,#10121e 72%)}
.hero h1{font-size:clamp(40px,8vw,70px);line-height:1;margin:18px 0}
.grad{background:linear-gradient(90deg,#7667ff,#d96cff);-webkit-background-clip:text;color:transparent}
.muted{color:#989db7}.tag{display:inline-block;background:#1a1d31;color:#a49aff;padding:6px 9px;border-radius:8px;font-size:12px}
.section{margin-top:25px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}
.card{padding:16px}
.product-img{width:100%;height:170px;object-fit:cover;border-radius:14px;border:1px solid #292d48;margin-bottom:10px;background:#0b0d17}
.admin-img{width:58px;height:58px;object-fit:cover;border-radius:10px;border:1px solid #303451;background:#0b0d17}
.qr-box{text-align:center;padding:15px;background:#0b0d17;border:1px solid #303451;border-radius:16px;margin-top:12px}
.qr-box img{width:min(280px,100%);max-width:280px;border-radius:12px;background:#fff}
.amount-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.amount-grid button{width:100%}
.admin-form{background:#0b0d17;border:1px solid #303451;border-radius:14px;padding:14px;margin:10px 0 16px}
.price{font-size:19px;font-weight:900;margin:12px 0}
input,select{width:100%;padding:12px;margin:6px 0 12px;border-radius:10px;border:1px solid #303451;background:#0b0d17;color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #292d48}
.hide{display:none!important}
.modal{position:fixed;inset:0;background:#000b;z-index:30;display:none;align-items:center;justify-content:center;padding:18px}
.modal.show{display:flex}
.modalbox{width:min(480px,100%);max-height:90vh;overflow:auto;background:#111426;border:1px solid #383c64;border-radius:20px;padding:20px}
.bottom{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(720px,calc(100% - 24px));z-index:10;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:7px;border:1px solid #292d48;border-radius:18px;background:#0d0f1af5}
.bottom button{background:transparent;color:#aeb3ca}.bottom .on{background:#29214e;color:#fff}.admin{border-color:#6f5cff}
.status{display:inline-block;padding:5px 8px;border-radius:8px;background:#1a1d31;margin-top:5px;font-size:12px}
@media(max-width:600px){
.nav .logo{font-size:16px}.nav #hello{display:none}.nav button{padding:9px}
.bottom{grid-template-columns:repeat(5,1fr)}.bottom button{padding:8px 3px;font-size:11px}
}
</style>
</head>
<body>

<header>
<div class="nav">
<div class="logo">🎮 <span>BLACK</span> GAG2 SHOP</div>
<span id="hello" class="muted"></span>
<button id="loginBtn" class="dark" onclick="modal('login')">Đăng nhập</button>
<button id="regBtn" class="primary" onclick="modal('register')">Đăng ký</button>
<button id="logoutBtn" class="dark hide" onclick="logout()">Đăng xuất</button>
</div>
</header>

<main class="wrap">

<section class="hero">
<span class="tag">GROW A GARDEN 2</span>
<h1>Mua bán GAG2<br><span class="grad">nhanh & tiện</span></h1>
<p class="muted">BLACK GAG2 SHOP — chỉ có Grow a Garden 2.</p>
<button class="primary" onclick="scrollToId('products')">🛒 Xem sản phẩm</button>
</section>

<section id="products" class="section">
<h2>🌱 Sản phẩm</h2>
<div id="productGrid" class="grid"></div>
</section>

<section id="topupSection" class="section">
<div class="panel" style="padding:20px">
<h2>💰 Nạp tiền</h2>
<button class="dark" onclick="topupCard()">💳 Thẻ cào</button>
<button class="dark" onclick="topupBank()">🏦 Bank</button>
<p id="topupMsg" class="muted"></p>
</div>
</section>

<section id="ordersSection" class="section">
<div class="panel" style="padding:20px">
<h2>📦 Đơn hàng</h2>
<div id="orders"></div>
</div>
</section>

<section id="profileSection" class="section">
<div class="panel" style="padding:20px">
<h2>👤 Hồ sơ</h2>
<div id="profile"><p class="muted">Đăng nhập để xem hồ sơ.</p></div>
</div>
</section>

<section id="adminSection" class="section hide">
<div class="panel admin" style="padding:20px">
<h2>👑 Admin</h2>
<div id="admin"></div>
</div>
</section>

</main>

<nav class="bottom">
<button id="navShop" class="on" onclick="scrollToId('products')">🏠<br>Shop</button>
<button id="navTopup" onclick="topupCard()">💳<br>Nạp tiền</button>
<button id="navOrders" onclick="loadOrders();scrollToId('ordersSection')">☷<br>Đơn hàng</button>
<button id="navProfile" onclick="scrollToId('profileSection')">👤<br>Hồ sơ</button>
<button id="navAdmin" class="hide" onclick="scrollToId('adminSection')">👑<br>Admin</button>
</nav>

<div class="modal" id="modal">
<div class="modalbox" id="modalbox"></div>
</div>

<script>
let token=localStorage.getItem("black_token")||"";
let products=[];
const $=id=>document.getElementById(id);
const money=n=>Number(n).toLocaleString("vi-VN")+"đ";

async function api(url,opt={}){
  opt.headers={...(opt.headers||{}),...(token?{Authorization:"Bearer "+token}:{})};
  if(opt.body&&typeof opt.body!=="string"){
    opt.headers["Content-Type"]="application/json";
    opt.body=JSON.stringify(opt.body);
  }
  const r=await fetch(url,opt);
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw Error(d.error||"Có lỗi");
  return d;
}

function scrollToId(id){
  $(id)?.scrollIntoView({behavior:"smooth",block:"start"});
}

async function loadProducts(){
  try{
    products=await api("/api/products");
    $("productGrid").innerHTML=products.map(p=>`
      <div class="card">
        ${p.image?`<img class="product-img" src="${p.image}" alt="">`:""}
        <span class="tag">GAG2</span>
        <h3>${escapeHtml(p.name)}</h3>
        <div class="muted">Grow a Garden 2</div>
        <div class="price">${money(p.price)} / 1</div>
        <button class="dark" onclick="buy(${p.id})">🛒 Thêm giỏ</button>
        <button class="primary" onclick="buy(${p.id},true)">⚡ Mua ngay</button>
      </div>
    `).join("")||'<p class="muted">Chưa có sản phẩm.</p>';
  }catch(e){
    $("productGrid").innerHTML='<p class="muted">Không tải được sản phẩm.</p>';
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function modal(type){
  $("modalbox").innerHTML=type==="login"?`
    <h2>🔐 Đăng nhập</h2>
    <input id="login" placeholder="Tên đăng nhập hoặc Email">
    <input id="pass" type="password" placeholder="Mật khẩu">
    <button class="primary" style="width:100%" onclick="doLogin()">Đăng nhập</button>
    <p class="muted">Chưa có tài khoản?
      <a href="#" onclick="modal('register');return false">Đăng ký</a>
    </p>
  `:`
    <h2>👤 Đăng ký</h2>
    <input id="user" placeholder="Tên đăng nhập">
    <input id="contact" placeholder="Số điện thoại hoặc Email">
    <input id="pass" type="password" placeholder="Mật khẩu">
    <button class="primary" style="width:100%" onclick="doRegister()">Tạo tài khoản</button>
    <p class="muted">Không cần OTP.</p>
  `;
  $("modal").classList.add("show");
}

function close(){
  $("modal").classList.remove("show");
}

async function doRegister(){
  try{
    const d=await api("/api/register",{
      method:"POST",
      body:{
        username:$("user").value,
        contact:$("contact").value,
        password:$("pass").value
      }
    });
    token=d.token;
    localStorage.setItem("black_token",token);
    close();
    refresh();
  }catch(e){alert(e.message)}
}

async function doLogin(){
  try{
    const d=await api("/api/login",{
      method:"POST",
      body:{login:$("login").value,password:$("pass").value}
    });
    token=d.token;
    localStorage.setItem("black_token",token);
    close();
    refresh();
  }catch(e){alert(e.message)}
}

async function logout(){
  try{if(token)await api("/api/logout",{method:"POST"})}catch(e){}
  token="";
  localStorage.removeItem("black_token");
  $("hello").textContent="";
  $("loginBtn").classList.remove("hide");
  $("regBtn").classList.remove("hide");
  $("logoutBtn").classList.add("hide");
  $("adminSection").classList.add("hide");
  $("navAdmin").classList.add("hide");
  $("profile").innerHTML='<p class="muted">Đăng nhập để xem hồ sơ.</p>';
  loadOrders();
}

async function refresh(){
  try{
    const u=await api("/api/me");
    $("hello").textContent=`👤 ${u.username} · ${money(u.balance)}`;
    $("loginBtn").classList.add("hide");
    $("regBtn").classList.add("hide");
    $("logoutBtn").classList.remove("hide");

    $("profile").innerHTML=`
      <div class="row"><span>Tài khoản</span><b>${escapeHtml(u.username)}</b></div>
      <div class="row"><span>Liên hệ</span><b>${escapeHtml(u.contact)}</b></div>
      <div class="row"><span>Số dư</span><b>${money(u.balance)}</b></div>
      <div class="row"><span>Quyền</span><b>${u.role==="admin"?"👑 ADMIN":"👤 USER"}</b></div>
      <br><button class="danger" onclick="logout()">Đăng xuất</button>
    `;

    if(u.role==="admin"){
      $("adminSection").classList.remove("hide");
      $("navAdmin").classList.remove("hide");
      loadAdmin();
    }else{
      $("adminSection").classList.add("hide");
      $("navAdmin").classList.add("hide");
    }

    loadOrders();
  }catch(e){
    if(token)logout();
  }
}

function buy(id){
  if(!token){modal("login");return}
  const p=products.find(x=>x.id===id);
  if(!p){alert("Không tìm thấy sản phẩm.");return}
  let qty=1;

  $("modalbox").innerHTML=`
    <h3>🛒 Mua ${escapeHtml(p.name)}</h3>
    <b>Số lượng</b>
    <div style="display:flex;align-items:center;justify-content:center;gap:18px;margin:10px 0 18px">
      <button class="dark" id="qtyMinus" style="width:45px;height:45px;font-size:22px">−</button>
      <strong id="qtyValue" style="font-size:22px">1</strong>
      <button class="dark" id="qtyPlus" style="width:45px;height:45px;font-size:22px">+</button>
    </div>
    <b>🎮 Tên tài khoản game</b>
    <input id="gameUsername" placeholder="Nhập tên tài khoản game">
    <p class="muted">Tổng tiền: <b id="buyTotal">${money(p.price)}</b></p>
    <button class="primary" id="confirmBuy" style="width:100%">Xác nhận mua</button>
    <button class="dark" id="cancelBuy" style="width:100%;margin-top:8px">Hủy</button>
  `;
  $("modal").classList.add("show");

  const update=()=>{
    $("qtyValue").textContent=qty;
    $("buyTotal").textContent=money(p.price*qty);
  };

  $("qtyMinus").onclick=()=>{
    if(qty>1){qty--;update()}
  };

  $("qtyPlus").onclick=()=>{
    if(p.stock>0&&qty>=p.stock){alert("Không đủ hàng.");return}
    qty++;update()
  };

  $("cancelBuy").onclick=close;
  $("confirmBuy").onclick=()=>{
    const gameUsername=$("gameUsername").value.trim();
    if(!gameUsername){alert("Vui lòng nhập tên tài khoản game.");return}
    checkout([{productId:id,qty}],gameUsername);
  };
}

async function checkout(items,gameUsername){
  try{
    const d=await api("/api/orders",{
      method:"POST",
      body:{items,gameUsername}
    });
    alert("Đặt hàng thành công. Mã đơn #"+d.orderId);
    close();
    refresh();
  }catch(e){alert(e.message)}
}

async function loadOrders(){
  if(!token){
    $("orders").innerHTML='<p class="muted">Đăng nhập để xem đơn hàng.</p>';
    return;
  }

  try{
    const a=await api("/api/orders");
    $("orders").innerHTML=a.map(o=>`
      <div class="card" style="margin:8px 0">
        <div class="row">
          <span>
            <b>#${o.id}</b><br>
            <small class="muted">Game: ${escapeHtml(o.game_username||"")}</small>
          </span>
          <b>${money(o.total)}</b>
        </div>
        <div class="muted" style="padding-top:8px">
          ${o.items.map(i=>`${escapeHtml(i.name)} × ${i.qty}`).join("<br>")}
        </div>
        <span class="status">${escapeHtml(o.status)}</span>
      </div>
    `).join("")||'<p class="muted">Chưa có đơn.</p>';
  }catch(e){}
}

function topupCard(){
  if(!token){modal("login");return}

  $("topupMsg").innerHTML=`
    <div class="panel" style="padding:15px;margin-top:12px">
      <h3>💳 Nạp thẻ cào</h3>
      <p class="muted">Chiết khấu 16% — user nhận 84% mệnh giá khi Admin duyệt.</p>
      <select id="cp">
        <option>Viettel</option>
        <option>Vinaphone</option>
        <option>Mobifone</option>
      </select>
      <select id="cv">
        ${[10000,20000,50000,100000,200000,500000].map(x=>`<option value="${x}">${money(x)}</option>`).join("")}
      </select>
      <input id="cs" placeholder="Serial">
      <input id="cc" placeholder="Mã thẻ">
      <button class="primary" onclick="sendCard()">Gửi thẻ</button>
      <p class="muted">Admin kiểm tra thẻ. Thẻ đúng sẽ duyệt, thẻ sai sẽ từ chối.</p>
    </div>
  `;
}

async function sendCard(){
  try{
    await api("/api/topups/card",{
      method:"POST",
      body:{
        provider:$("cp").value,
        value:Number($("cv").value),
        serial:$("cs").value,
        code:$("cc").value
      }
    });
    alert("Đã gửi thẻ. Vui lòng chờ Admin kiểm tra.");
    $("topupMsg").textContent="";
  }catch(e){alert(e.message)}
}

async function topupBank(){
  if(!token){modal("login");return}

  try{
    const b=await api("/api/bank-info");

    const amounts=[10000,20000,50000,100000,200000,500000];

    $("topupMsg").innerHTML=`
      <div class="panel" style="padding:15px;margin-top:12px">
        <h3>🏦 Nạp Bank</h3>
        <p class="muted">Tối thiểu 10.000đ. Bank được cộng đủ 100% khi Admin duyệt.</p>
        ${b.configured?`
          <div class="row"><span>Ngân hàng</span><b>${escapeHtml(b.bankName||"Bank")}</b></div>
          <div class="row"><span>Số tài khoản</span><b>${escapeHtml(b.account)}</b></div>
          <div class="row"><span>Chủ tài khoản</span><b>${escapeHtml(b.accountName)}</b></div>
        `:`<p class="muted">Admin chưa cấu hình thông tin Bank.</p>`}

        <div class="amount-grid">
          ${amounts.map(x=>`
            <button class="dark" onclick="createBankTopup(${x})">${money(x)}</button>
          `).join("")}
        </div>

        ${b.qrUrl?`<div class="qr-box"><img src="${b.qrUrl}" alt="QR Bank"><p class="muted">Quét QR để chuyển khoản.</p></div>`:""}

        <p class="muted">Sau khi chuyển khoản, bấm đúng số tiền ở trên để tạo yêu cầu. Admin sẽ kiểm tra và duyệt.</p>
      </div>
    `;
  }catch(e){alert(e.message)}
}

async function createBankTopup(amount){
  if(!confirm(`Tạo yêu cầu nạp ${money(amount)}?`))return;

  try{
    await api("/api/topups/bank",{
      method:"POST",
      body:{amount}
    });
    alert("Đã tạo yêu cầu nạp Bank. Chờ Admin duyệt.");
  }catch(e){alert(e.message)}
}

/* ==================================================
   ADMIN
================================================== */

let adminData=null;

async function loadAdmin(){
  try{
    adminData=await api("/api/admin/overview");

    $("admin").innerHTML=`
      <div class="admin-form">
        <h3>💰 Cộng tiền cho User</h3>
        <p class="muted">Nhập tên tài khoản user trong shop rồi nhập số tiền.</p>
        <input id="addBalanceUsername" placeholder="Tên tài khoản user">
        <input id="addBalanceAmount" type="number" min="1" step="1000" placeholder="Số tiền muốn cộng">
        <button class="primary" style="width:100%" onclick="adminAddBalance()">💰 Cộng tiền</button>
        <p id="addBalanceMsg" class="muted"></p>
      </div>

      <div class="admin-form">
        <h3>➕ Thêm sản phẩm</h3>
        <input id="newName" placeholder="Tên sản phẩm">
        <input id="newPrice" type="number" placeholder="Giá">
        <input id="newStock" type="number" placeholder="Stock (0 = không giới hạn)">
        <input id="newImage" type="file" accept="image/*">
        <button class="primary" style="width:100%" onclick="adminAddProduct()">Thêm sản phẩm</button>
      </div>

      <div class="admin-form">
        <h3>🌱 Sản phẩm</h3>
        <div id="adminProducts"></div>
      </div>

      <div class="admin-form">
        <h3>💳 / 🏦 Yêu cầu nạp tiền</h3>
        <div id="adminTopups"></div>
      </div>

      <div class="admin-form">
        <h3>📦 Đơn hàng</h3>
        <div id="adminOrders"></div>
      </div>

      <div class="admin-form">
        <h3>👥 Users</h3>
        <div id="adminUsers"></div>
      </div>
    `;

    renderAdmin();
  }catch(e){
    console.error(e);
  }
}

function renderAdmin(){
  if(!adminData)return;

  $("adminProducts").innerHTML=adminData.products.map(p=>`
    <div class="card" style="margin:8px 0">
      <div style="display:flex;gap:10px;align-items:center">
        ${p.image?`<img class="admin-img" src="${p.image}" alt="">`:""}
        <div style="flex:1">
          <b>${escapeHtml(p.name)}</b>
          <div class="muted">ID ${p.id} · ${money(p.price)} · Stock ${p.stock}</div>
          <div class="muted">${p.active?"Đang hiện":"Đang ẩn"}</div>
        </div>
      </div>

      <input id="pn_${p.id}" value="${escapeAttr(p.name)}" placeholder="Tên">
      <input id="pp_${p.id}" type="number" value="${p.price}" placeholder="Giá">
      <input id="ps_${p.id}" type="number" value="${p.stock}" placeholder="Stock">
      <input id="pi_${p.id}" type="file" accept="image/*">

      <button class="primary" onclick="adminEditProduct(${p.id})">💾 Lưu</button>
      <button class="dark" onclick="adminRemoveImage(${p.id})">🖼️ Xóa ảnh</button>
      ${p.active
        ?`<button class="danger" onclick="adminHide(${p.id})">Ẩn</button>`
        :`<button class="dark" onclick="adminShow(${p.id})">Hiện</button>`}
    </div>
  `).join("")||'<p class="muted">Chưa có sản phẩm.</p>';

  $("adminTopups").innerHTML=adminData.topups.map(t=>`
    <div class="card" style="margin:8px 0">
      <b>#${t.id} · ${escapeHtml(t.username)}</b>
      <div class="muted">${t.method} · Mệnh giá: ${money(t.amount)}</div>
      ${t.method==="CARD"?`
        <div style="margin-top:8px">
          Nhà mạng: <b>${escapeHtml(t.provider||"")}</b><br>
          Serial: <b>${escapeHtml(t.serial||"")}</b><br>
          Mã thẻ: <b>${escapeHtml(t.code||"")}</b><br>
          Nếu đúng: cộng <b>${money(Math.floor(t.amount*0.84))}</b> (84%)
        </div>
      `:"<div class='muted'>Bank: duyệt sẽ cộng đủ 100%.</div>"}

      <div class="muted">Trạng thái: ${escapeHtml(t.status)}</div>

      ${t.status==="PENDING"?`
        <button class="primary" onclick="adminApproveTopup(${t.id})">✅ Thẻ/Bank đúng - Duyệt</button>
        <button class="danger" onclick="adminRejectTopup(${t.id})">❌ Thẻ sai - Từ chối</button>
      `:""}
    </div>
  `).join("")||'<p class="muted">Không có yêu cầu nạp.</p>';

  $("adminOrders").innerHTML=adminData.orders.map(o=>`
    <div class="card" style="margin:8px 0">
      <b>#${o.id} · ${escapeHtml(o.username)}</b>
      <div class="muted">Game: ${escapeHtml(o.game_username||"")}</div>
      <div class="muted">Tổng: ${money(o.total)}</div>
      <div class="muted">${o.items.map(i=>`${escapeHtml(i.name)} × ${i.qty}`).join(", ")}</div>
      <select id="orderStatus_${o.id}">
        ${["PENDING","PROCESSING","COMPLETED","CANCELLED"].map(s=>`
          <option ${s===o.status?"selected":""}>${s}</option>
        `).join("")}
      </select>
      <button class="primary" onclick="adminOrderStatus(${o.id})">Cập nhật đơn</button>
    </div>
  `).join("")||'<p class="muted">Chưa có đơn.</p>';

  $("adminUsers").innerHTML=adminData.users.map(u=>`
    <div class="row">
      <span>
        <b>${escapeHtml(u.username)}</b><br>
        <small class="muted">${escapeHtml(u.contact)}</small>
      </span>
      <b>${money(u.balance)}</b>
    </div>
  `).join("");
}

function escapeAttr(s){
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

async function adminAddBalance(){
  const username=$("addBalanceUsername").value.trim();
  const amount=Math.floor(Number($("addBalanceAmount").value)||0);

  if(!username){alert("Vui lòng nhập tên user.");return}
  if(amount<=0){alert("Số tiền không hợp lệ.");return}

  if(!confirm(`Cộng ${money(amount)} cho ${username}?`))return;

  try{
    const d=await api("/api/admin/users/add-balance",{
      method:"POST",
      body:{username,amount}
    });

    $("addBalanceMsg").innerHTML=`
      ✅ Đã cộng <b>${money(d.added)}</b> cho
      <b>${escapeHtml(d.username)}</b>.<br>
      Số dư cũ: ${money(d.oldBalance)}<br>
      Số dư mới: <b>${money(d.newBalance)}</b>
    `;

    $("addBalanceUsername").value="";
    $("addBalanceAmount").value="";
    await loadAdmin();
  }catch(e){alert(e.message)}
}

function readImage(file){
  return new Promise((resolve,reject)=>{
    if(!file){resolve(null);return}
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

async function adminAddProduct(){
  try{
    const image=await readImage($("newImage").files[0]);

    await api("/api/admin/products",{
      method:"POST",
      body:{
        name:$("newName").value,
        price:Number($("newPrice").value),
        stock:Number($("newStock").value||0),
        image
      }
    });

    alert("Đã thêm sản phẩm.");
    await loadProducts();
    await loadAdmin();
  }catch(e){alert(e.message)}
}

async function adminEditProduct(id){
  try{
    const file=$(`pi_${id}`).files[0];
    const image=await readImage(file);

    const body={
      name:$(`pn_${id}`).value,
      price:Number($(`pp_${id}`).value),
      stock:Number($(`ps_${id}`).value)
    };

    if(image)body.image=image;

    await api(`/api/admin/products/${id}`,{
      method:"PATCH",
      body
    });

    alert("Đã lưu sản phẩm. User sẽ thấy giá/ảnh mới.");
    await loadProducts();
    await loadAdmin();
  }catch(e){alert(e.message)}
}

async function adminRemoveImage(id){
  if(!confirm("Xóa ảnh sản phẩm này?"))return;

  try{
    await api(`/api/admin/products/${id}/remove-image`,{
      method:"POST"
    });
    await loadProducts();
    await loadAdmin();
  }catch(e){alert(e.message)}
}

async function adminHide(id){
  try{
    await api(`/api/admin/products/${id}/hide`,{method:"POST"});
    await loadProducts();
    await loadAdmin();
  }catch(e){alert(e.message)}
}

async function adminShow(id){
  try{
    await api(`/api/admin/products/${id}/show`,{method:"POST"});
    await loadProducts();
    await loadAdmin();
  }catch(e){alert(e.message)}
}

async function adminApproveTopup(id){
  if(!confirm("Xác nhận giao dịch đúng và duyệt tiền?"))return;

  try{
    const d=await api(`/api/admin/topups/${id}/approve`,{
      method:"POST"
    });

    alert("Đã duyệt. Cộng "+money(d.creditedAmount)+" vào số dư user.");
    await loadAdmin();
  }catch(e){alert(e.message)}
}

async function adminRejectTopup(id){
  if(!confirm("Xác nhận thẻ sai/giao dịch không hợp lệ và từ chối?"))return;

  try{
    await api(`/api/admin/topups/${id}/reject`,{
      method:"POST"
    });

    alert("Đã từ chối. Không cộng tiền.");
    await loadAdmin();
  }catch(e){alert(e.message)}
}

async function adminOrderStatus(id){
  try{
    await api(`/api/admin/orders/${id}/status`,{
      method:"POST",
      body:{status:$(`orderStatus_${id}`).value}
    });

    alert("Đã cập nhật đơn.");
    await loadAdmin();
  }catch(e){alert(e.message)}
}

async function adminLogin(){
  if(!token){modal("login");return}
  try{
    const u=await api("/api/me");
    if(u.role!=="admin"){
      alert("Bạn không có quyền Admin.");
      return;
    }
    scrollToId("adminSection");
  }catch(e){alert(e.message)}
}

$("modal").addEventListener("click",e=>{
  if(e.target===$("modal"))close();
});

loadProducts();
if(token)refresh();
else loadOrders();
</script>
