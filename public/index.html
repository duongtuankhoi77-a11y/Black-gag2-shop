<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<title>BLACK GAG2 SHOP</title>

<style>

*{

body{

button{

.btn{
background:#151b30;
color:white;
}


.primary{
background:linear-gradient(90deg,#7655ff,#b05cff);

.hide{

}


.balance{

color:#5cffb1;

border-radius:12px;

}



.wrap{
max-width:1200px;
margin:auto;
padding:25px 15px 100px;
}



.hero{

background:
radial-gradient(circle at top right,#45236e,#111629);

padding:35px;

border-radius:25px;

border:1px solid #252b45;

}


.hero h1{

font-size:60px;

margin:15px 0;

}


.gradient{

background:linear-gradient(90deg,#806cff,#e26cff);

-webkit-background-clip:text;

}



.card{

background:#101625;

border:1px solid #252b45;

border-radius:20px;

padding:18px;

margin-top:20px;

}



.grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(230px,1fr));

gap:15px;

}



.product{

background:#0d1322;

border:1px solid #252b45;

border-radius:18px;

padding:15px;

}



.product img{

width:100%;

height:180px;

object-fit:cover;

border-radius:15px;

}



.price{

font-size:22px;

font-weight:bold;

color:#7cffc1;

margin:10px 0;

}



input,select{

width:100%;

background:#090e1b;

color:white;

border:1px solid #303957;

border-radius:10px;

padding:12px;

margin:6px 0;

}



.modal{

display:none;

position:fixed;

inset:0;

background:#000b;

align-items:center;

justify-content:center;

z-index:200;

}



.modal.show{

display:flex;

}



.modal-box{

width:400px;

max-width:95%;

background:#101625;

padding:20px;

border-radius:20px;

border:1px solid #333d60;

}



.admin-box{

background:#0c1220;

padding:15px;

border-radius:15px;

border:1px solid #252b45;

margin-top:15px;

}



.bottom{

position:fixed;

bottom:10px;

left:50%;

transform:translateX(-50%);

background:#0d1220ee;

border:1px solid #252b45;

border-radius:18px;

padding:8px;

display:flex;

gap:5px;

z-index:100;

}



.bottom button{

background:none;

color:#aaa;

}



.bottom button:hover{

background:#33235d;

color:white;

}



@media(max-width:600px){

.hero h1{

font-size:40px;

}

}


</style>

</head><body>

<div class="top">

<div class="nav">

<div class="logo">
🎮 <span>BLACK</span> GAG2 SHOP
</div>


<div id="hello"></div>


<div id="balance" class="balance hide">
0đ
</div>


<button id="loginBtn" class="btn" onclick="openLogin()">
Đăng nhập
</button>


<button id="regBtn" class="primary" onclick="openRegister()">
Đăng ký
</button>


<button id="logoutBtn" class="btn hide" onclick="logout()">
Đăng xuất
</button>


</div>

</div>



<div class="wrap">


<section class="hero">

<h3>GROW A GARDEN 2</h3>

<h1>
Mua bán GAG2
<br>
<span class="gradient">
Nhanh & tiện
</span>
</h1>


<p>
BLACK GAG2 SHOP - Shop game, nạp tiền, mua vật phẩm.
</p>


<button class="primary" onclick="goShop()">
🛒 Xem Shop
</button>


</section>





<section class="card">


<h2>
🛍️ Sản phẩm
</h2>


<div id="productGrid" class="grid">

</div>


</section>







<section class="card">


<h2>
💰 Nạp tiền
</h2>


<button class="primary" onclick="topupCard()">
💳 Thẻ cào
</button>


<button class="btn" onclick="topupBank()">
🏦 Bank QR
</button>



<div id="topupArea">

</div>


</section>







<section class="card">


<h2>
👤 Hồ sơ
</h2>


<div id="profile">

Vui lòng đăng nhập

</div>


</section>








<section id="adminSection" class="card hide">


<h2>
👑 ADMIN CENTER
</h2>



<button class="primary" onclick="loadAdmin()">
Tải dữ liệu
</button>




<div id="adminContent">


</div>



</section>




</div>







<div class="bottom">


<button onclick="goShop()">
🏠<br>
Shop
</button>



<button onclick="topupCard()">
💳<br>
Nạp
</button>



<button onclick="showProfile()">
👤<br>
Hồ sơ
</button>



<button id="adminBtn" class="hide" onclick="showAdmin()">
👑<br>
Admin
</button>



</div>









<!-- LOGIN MODAL -->

<div id="modal" class="modal">


<div class="modal-box" id="modalBox">


</div>


</div>






<script>let token = localStorage.getItem("black_token") || "";

let products = [];

const $ = id => document.getElementById(id);


function money(n){
    return Number(n || 0).toLocaleString("vi-VN")+"đ";
}



async function api(url,opt={}){

    opt.headers = {
        ...(opt.headers || {}),
        ...(token ? {
            Authorization:"Bearer "+token
        }: {})
    };


    if(opt.body){

        opt.headers["Content-Type"]="application/json";

        opt.body=JSON.stringify(opt.body);

    }


    let res = await fetch(url,opt);

    let data = await res.json().catch(()=>({}));


    if(!res.ok){

        throw Error(data.message || "Có lỗi");

    }


    return data;

}






// =======================
// ĐĂNG NHẬP
// =======================


function openLogin(){


$("modalBox").innerHTML=`

<h2>🔐 Đăng nhập</h2>


<input id="loginUser" placeholder="Tên tài khoản">


<input id="loginPass" type="password" placeholder="Mật khẩu">


<button class="primary" onclick="login()">
Đăng nhập
</button>

`;

$("modal").classList.add("show");


}





async function login(){


try{


let username=$("loginUser").value;

let password=$("loginPass").value;



let data=await api("/api/login",{

method:"POST",

body:{
username,
password
}

});



token=data.token;


localStorage.setItem(
"black_token",
token
);



closeModal();


await refresh();



}catch(e){

alert(e.message);

}


}







// =======================
// ĐĂNG KÝ
// =======================


function openRegister(){


$("modalBox").innerHTML=`

<h2>👤 Đăng ký</h2>


<input id="regUser" placeholder="Tên tài khoản">


<input id="regContact" placeholder="Email / SĐT">


<input id="regPass" type="password" placeholder="Mật khẩu">


<button class="primary" onclick="register()">
Tạo tài khoản
</button>


`;

$("modal").classList.add("show");

}





async function register(){


try{


let data=await api("/api/register",{

method:"POST",

body:{

username:$("regUser").value,

contact:$("regContact").value,

password:$("regPass").value

}


});



token=data.token;


localStorage.setItem(
"black_token",
token
);



closeModal();


refresh();


}catch(e){

alert(e.message);

}

}







function closeModal(){

$("modal").classList.remove("show");

}







// =======================
// LOAD USER
// =======================


async function refresh(){


try{


let data=await api("/api/me");


let u=data.user;



$("hello").innerHTML="👤 "+u.username;


$("balance").innerHTML=money(u.balance);


$("balance").classList.remove("hide");


$("loginBtn").classList.add("hide");


$("regBtn").classList.add("hide");


$("logoutBtn").classList.remove("hide");




if(u.username==="blackadmin"){


$("adminBtn").classList.remove("hide");


$("adminSection").classList.remove("hide");


}




loadProfile();



}catch(e){


token="";

localStorage.removeItem(
"black_token"
);


}



}








// =======================
// LOAD PRODUCTS
// =======================


async function loadProducts(){


try{


let data=await api("/api/products");


products=data.products;



$("productGrid").innerHTML=
products.map(p=>`


<div class="product">


${p.image ?

`<img src="${p.image}">`

:

`🌱`

}



<h3>
${p.name}
</h3>



<div class="price">
${money(p.price)}
</div>



<p>
Kho: ${p.stock}
</p>



<button class="primary"
onclick="buy(${p.id})">

⚡ Mua ngay

</button>



</div>


`).join("");



}catch(e){

console.log(e);

}


}







// =======================
// MUA HÀNG
// =======================


function buy(id){


if(!token){

openLogin();

return;

}


let p=products.find(x=>x.id===id);



$("modalBox").innerHTML=`

<h2>
🛒 ${p.name}
</h2>



<input id="buyQty"
type="number"
value="1"
min="1">



<input id="gameName"
placeholder="Tên Roblox">



<button class="primary"
onclick="checkout(${p.id})">

Xác nhận mua

</button>


`;



$("modal").classList.add("show");


}






async function checkout(id){


try{


await api("/api/orders",{

method:"POST",

body:{

items:[{

product_id:id,

quantity:Number($("buyQty").value)

}]


}

});



alert("Mua thành công");


closeModal();


loadProducts();


refresh();



}catch(e){

alert(e.message);

}


}
// =======================
// TOPUP CARD
// =======================

function topupCard(){

if(!token){
openLogin();
return;
}


$("topupArea").innerHTML=`

<div class="admin-box">

<h3>💳 Nạp thẻ cào</h3>


<select id="provider">
<option>Viettel</option>
<option>Mobifone</option>
<option>Vinaphone</option>
</select>



<select id="cardValue">

<option value="10000">10.000đ</option>
<option value="20000">20.000đ</option>
<option value="50000">50.000đ</option>
<option value="100000">100.000đ</option>

</select>



<input id="serial" placeholder="Serial">


<input id="code" placeholder="Mã thẻ">



<button class="primary" onclick="sendCard()">
Gửi thẻ
</button>


</div>

`;

}




async function sendCard(){

try{


await api("/api/topups/card",{

method:"POST",

body:{

provider:$("provider").value,

value:Number($("cardValue").value),

serial:$("serial").value,

code:$("code").value

}

});



alert("Đã gửi thẻ chờ duyệt");


}catch(e){

alert(e.message);

}

}






// =======================
// BANK QR
// =======================


function topupBank(){


if(!token){

openLogin();

return;

}



$("topupArea").innerHTML=`

<div class="admin-box">


<h3>🏦 Nạp Bank QR</h3>


<button class="btn" onclick="showQR(10000)">
10.000đ
</button>


<button class="btn" onclick="showQR(20000)">
20.000đ
</button>


<button class="btn" onclick="showQR(50000)">
50.000đ
</button>


<button class="btn" onclick="showQR(100000)">
100.000đ
</button>



<div id="qrArea">

</div>


</div>

`;

}




async function showQR(amount){


try{


let data=await api("/api/bank-info");



$("qrArea").innerHTML=`

<h3>QR ${money(amount)}</h3>


<p>
Ngân hàng: ${data.bankName || ""}
</p>


<p>
STK: ${data.account || ""}
</p>


<p>
Chủ TK: ${data.accountName || ""}
</p>


<button class="primary"
onclick="submitBank(${amount})">

Tôi đã chuyển

</button>


`;



}catch(e){

alert(e.message);

}


}





async function submitBank(amount){


try{


await api("/api/topups/bank",{

method:"POST",

body:{
amount
}

});



alert("Đã gửi yêu cầu nạp");


}catch(e){

alert(e.message);

}


}







// =======================
// PROFILE
// =======================


async function loadProfile(){


if(!token){

$("profile").innerHTML="Vui lòng đăng nhập";

return;

}


try{


let data=await api("/api/me");

let u=data.user;


$("profile").innerHTML=`

<h3>
👤 ${u.username}
</h3>


<p>
Liên hệ: ${u.contact}
</p>


<p>
Số dư: ${money(u.balance)}
</p>


<p>
Quyền:
${u.username==="blackadmin"
?"👑 ADMIN"
:"USER"}

</p>

`;



}catch(e){}


}






function showProfile(){

$("profile").scrollIntoView();

}






// =======================
// ADMIN
// =======================


function showAdmin(){

$("adminSection").scrollIntoView();

}





async function loadAdmin(){


try{


let users=await api("/api/admin/users");

let products=await api("/api/admin/products");

let topups=await api("/api/admin/topups");



$("adminContent").innerHTML=`

<h3>👥 Users</h3>


${users.users.map(u=>`

<div class="admin-box">

<b>${u.username}</b>

<p>
Số dư:
${money(u.balance)}
</p>


<input id="money${u.id}"
type="number"
placeholder="Số tiền">


<button class="primary"
onclick="addMoney(${u.id})">

Cộng tiền

</button>


</div>


`).join("")}



<h3>💰 Nạp chờ duyệt</h3>


${topups.topups.map(t=>`

<div class="admin-box">

<b>
${t.username}
</b>


<p>
${t.method}
-
${money(t.amount)}
</p>


<button class="primary"
onclick="approveTopup(${t.id})">

Duyệt

</button>



<button class="btn"
onclick="rejectTopup(${t.id})">

Từ chối

</button>


</div>


`).join("")}


`;



}catch(e){

alert(e.message);

}


}






async function addMoney(id){


let user=prompt("Username");


let amount=Number(
prompt("Số tiền")
);



await api("/api/admin/users/add-balance",{

method:"POST",

body:{
username:user,
amount
}

});


alert("Đã cộng tiền");


loadAdmin();


}







async function approveTopup(id){


await api(
`/api/admin/topups/${id}/approve`,
{
method:"POST"
}
);



alert("Đã duyệt");


loadAdmin();


}





async function rejectTopup(id){


await api(
`/api/admin/topups/${id}/reject`,
{
method:"POST"
}
);



alert("Đã từ chối");


loadAdmin();


}







// =======================
// LOGOUT
// =======================


async function logout(){


try{


await api("/api/logout",{
method:"POST"
});


}catch(e){}



token="";


localStorage.removeItem(
"black_token"
);


location.reload();


}







// =======================
// START
// =======================


$("modal").onclick=e=>{

if(e.target.id==="modal"){

closeModal();

}

};



(async()=>{


await loadProducts();


if(token){

await refresh();

}


})();

</script>
