<!doctype html>
<html lang="vi">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>BLACK GAG2 SHOP</title>

<style>

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:#080a13;
  color:#fff;
  font-family:Arial,sans-serif
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:18px 16px 110px
}

header{
  position:sticky;
  top:0;
  z-index:5;
  background:#0b0d18ee;
  border-bottom:1px solid #292d48
}

.nav{
  max-width:1100px;
  margin:auto;
  padding:13px 16px;
  display:flex;
  gap:8px;
  align-items:center
}

.logo{
  font-size:20px;
  font-weight:900;
  margin-right:auto
}

.logo span{
  color:#8b6cff
}

button{
  border:0;
  border-radius:11px;
  padding:11px 14px;
  cursor:pointer;
  font-weight:800
}

.primary{
  background:linear-gradient(
    100deg,
    #6657ff,
    #aa5cff
  );
  color:#fff
}

.dark{
  background:#171a2c;
  color:#fff;
  border:1px solid #303451
}

.danger{
  background:#3b1820;
  color:#fff
}

.success{
  background:#173b2b;
  color:#fff;
  border:1px solid #285b42
}

.hero,
.panel,
.card{
  background:#10121e;
  border:1px solid #292d48;
  border-radius:20px
}

.hero{
  padding:35px;
  background:radial-gradient(
    circle at 85% 15%,
    #4c2c86,
    #15162a 40%,
    #10121e 72%
  )
}

.hero h1{
  font-size:clamp(40px,8vw,70px);
  line-height:1;
  margin:18px 0
}

.grad{
  background:linear-gradient(
    90deg,
    #7667ff,
    #d96cff
  );

  -webkit-background-clip:text;
  color:transparent
}

.muted{
  color:#989db7
}

.tag{
  display:inline-block;
  background:#1a1d31;
  color:#a49aff;
  padding:6px 9px;
  border-radius:8px;
  font-size:12px
}

.section{
  margin-top:25px
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(210px,1fr));
  gap:13px
}

.card{
  padding:16px
}

.product-img{
  width:100%;
  height:170px;
  object-fit:cover;
  border-radius:14px;
  border:1px solid #292d48;
  margin-bottom:10px;
  background:#0b0d17
}

.admin-img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid #303451;
  background:#0b0d17
}

.price{
  font-size:19px;
  font-weight:900;
  margin:12px 0
}

input,
select{
  width:100%;
  padding:12px;
  margin:6px 0 12px;
  border-radius:10px;
  border:1px solid #303451;
  background:#0b0d17;
  color:#fff
}

textarea{
  width:100%;
  min-height:100px;
  padding:12px;
  border-radius:10px;
  border:1px solid #303451;
  background:#0b0d17;
  color:#fff
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #292d48
}

.hide{
  display:none!important
}

.modal{
  position:fixed;
  inset:0;
  background:#000b;
  z-index:30;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px
}

.modal.show{
  display:flex
}

.modalbox{
  width:min(480px,100%);
  max-height:90vh;
  overflow:auto;
  background:#111426;
  border:1px solid #383c64;
  border-radius:20px;
  padding:20px
}

.bottom{
  position:fixed;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  width:min(720px,calc(100% - 24px));
  z-index:10;
  display:grid;
  grid-template-columns:
    repeat(5,1fr);
  gap:5px;
  padding:7px;
  border:1px solid #292d48;
  border-radius:18px;
  background:#0d0f1af5
}

.bottom button{
  background:transparent;
  color:#aeb3ca
}

.bottom .on{
  background:#29214e;
  color:#fff
}

.admin{
  border-color:#6f5cff
}

.admin-product{
  padding:14px;
  border:1px solid #303451;
  border-radius:15px;
  margin:12px 0;
  background:#0b0d17
}

.admin-actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap
}

.qr-box{
  text-align:center;
  padding:15px;
  background:#0b0d17;
  border:1px solid #303451;
  border-radius:16px;
  margin-top:12px
}

.qr-box img{
  width:min(280px,100%);
  border-radius:12px;
  background:#fff
}

.amount-grid{
  display:grid;
  grid-template-columns:
    repeat(2,1fr);
  gap:8px;
  margin:10px 0
}

.amount-grid button{
  width:100%
}

.status-pending{
  color:#ffd166
}

.status-approved{
  color:#5cff9a
}

.status-rejected{
  color:#ff6b7a
}

@media(max-width:600px){

  .nav .logo{
    font-size:16px
  }

  .nav #hello{
    display:none
  }

  .nav button{
    padding:9px
  }

  .bottom{
    grid-template-columns:
      repeat(5,1fr)
  }

  .bottom button{
    padding:8px 3px;
    font-size:11px
  }

}

</style>

</head>

<body>

<header>

<div class="nav">

<div class="logo">

<button

</header>

<main class="wrap">

<section class="hero">

<span class="tag">
GROW A GARDEN 2
</span>

<h1>
Mua bán GAG2<br>
<span class="grad">
nhanh & tiện
</span>
</h1>

<p class="muted">
BLACK GAG2 SHOP — chỉ có Grow a Garden 2.
</p>

<button
  class="primary"
  onclick="scrollToId('products')">
🛒 Xem sản phẩm
</button>

</section>

<section
  id="products"
  class="section">

<div
  id="productGrid"
  class="grid">
</div>

</section>

<section
  id="topupSection"
  class="section">

<div
  class="panel"
  style="padding:20px">

<h2>💰 Nạp tiền</h2>

<button
  class="dark"
  onclick="topupCard()">
💳 Thẻ cào
</button>

<button
  class="dark"
  onclick="topupBank()">
🏦 Bank
</button>

<p
  id="topupMsg"
  class="muted">
</p>

</div>

</section>

<section

  class="section">

<div
  class="panel"
  style="padding:20px">

<h2>📦 Đơn hàng</h2>

<div id="orders"></div>

</div>

</section>

<section
  id="profileSection"
  class="section">

<div
  class="panel"
  style="padding:20px">

<h2>👤 Hồ sơ</h2>

<div id="profile">

<p class="muted">

</p>

</div>

</div>

</section>

<section
  id="adminSection"

<div
  class="panel admin"
  style="padding:20px">

<h2>👑 Admin</h2>

<div id="admin"></div>

</div>

</section>

</main>

<nav class="bottom">

<button
  id="navShop"
  class="on"
  onclick="scrollToId('products')">
🏠<br>Shop
</button>

<button
  id="navTopup"
  onclick="topupCard()">
💳<br>Nạp tiền
</button>

<button
  id="navOrders"
  onclick="loadOrders();scrollToId('ordersSection')">
☷<br>Đơn hàng
</button>

<button
  id="navProfile"
  onclick="scrollToId('profileSection')">
👤<br>Hồ sơ
</button>

<button
  id="navAdmin"
  class="hide"
  onclick="scrollToId('adminSection')">
👑<br>Admin
</button>

<div
  class="modal"
  id="modal">

<div
  class="modalbox"
  id="modalbox">
</div>

<script>

let token =
  localStorage.getItem(
    "black_token"
  ) || "";

let products = [];

const $ = id =>
  document.getElementById(id);

const money = n =>
  Number(n).toLocaleString("vi-VN") + "đ";

/* ==================================================
   ESCAPE HTML
================================================== */

function esc(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* ==================================================
   SCROLL
================================================== */

function scrollToId(id){

  const el = $(id);

  if(el){
    el.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });
  }
}

/* ==================================================
   API
================================================== */

async function api(url,opt={}){

  opt.headers = {
    ...(opt.headers || {}),
    ...(token
      ? {
          Authorization:
            "Bearer " + token
        }
      : {})
  };

  if(
    opt.body &&
    typeof opt.body !== "string"
  ){

    opt.headers["Content-Type"] =
      "application/json";

    opt.body =
      JSON.stringify(opt.body);
  }

  const r =
    await fetch(url,opt);

  const d =
    await r.json()
      .catch(() => ({}));

  if(!r.ok){

    throw Error(
      d.error || "Có lỗi."
    );
  }

  return d;
}

/* ==================================================
   LOAD PRODUCTS
   USER LUÔN LẤY DỮ LIỆU MỚI TỪ DATABASE
================================================== */

async function loadProducts(){

  try{

    products =
      await api(
        "/api/products?ts=" +
        Date.now()
      );

    renderProducts();

  }catch(e){

    console.error(e);

    $("productGrid").innerHTML =
      `<p class="muted">
        Không tải được sản phẩm.
      </p>`;
  }
}

/* ==================================================
   RENDER PRODUCTS
================================================== */

function renderProducts(){

  $("productGrid").innerHTML =
    products.map(p => `

      <div class="card">

        ${
          p.image
          ? `
            <img
              class="product-img"
              src="${p.image}"
              alt="${esc(p.name)}">
          `
          : `
            <div
              class="product-img"
              style="
                display:flex;
                align-items:center;
                justify-content:center;
                color:#666;
              ">
              Chưa có ảnh
            </div>
          `
        }

        <span class="tag">
          GAG2
        </span>

        <h3>
          ${esc(p.name)}
        </h3>

        <div class="muted">
          Grow a Garden 2
        </div>

        <div class="price">
          ${money(p.price)} / 1
        </div>

        <button
          class="dark"
          onclick="buy(${p.id})">
          🛒 Mua
        </button>

        <button
          class="primary"
          onclick="buy(${p.id},true)">
          ⚡ Mua ngay
        </button>

      </div>

    `).join("");

}

/* ==================================================
   MODAL
================================================== */

function modal(type){

  $("modalbox").innerHTML =
    type === "login"

    ? `

      <h2>🔐 Đăng nhập</h2>

      <input
        id="login"
        placeholder="Tên đăng nhập hoặc Email">

      <input
        id="pass"
        type="password"
        placeholder="Mật khẩu">

      <button
        class="primary"
        style="width:100%"
        onclick="doLogin()">
        Đăng nhập
      </button>

      <p class="muted">
        Chưa có tài khoản?

        <a
          href="#"
          onclick="
            modal('register');
            return false;
          ">
          Đăng ký
        </a>
      </p>

    `

    : `

      <h2>👤 Đăng ký</h2>

      <input
        id="user"
        placeholder="Tên đăng nhập">

      <input
        id="contact"
        placeholder="Số điện thoại hoặc Email">

      <input
        id="pass"
        type="password"
        placeholder="Mật khẩu">

      <button
        class="primary"
        style="width:100%"
        onclick="doRegister()">
        Tạo tài khoản
      </button>

      <p class="muted">
        Mật khẩu tối thiểu 6 ký tự.
      </p>

    `;

  $("modal")
    .classList
    .add("show");
}

function close(){

  $("modal")
    .classList
    .remove("show");
}

/* ==================================================
   REGISTER
================================================== */

async function doRegister(){

  try{

    const d =
      await api(
        "/api/register",
        {
          method:"POST",
          body:{
            username:
              $("user").value,
            contact:
              $("contact").value,
            password:
              $("pass").value
          }
        }
      );

    token = d.token;

    localStorage.setItem(
      "black_token",
      token
    );

    close();

    await refresh();

  }catch(e){

    alert(e.message);

  }
}

/* ==================================================
   LOGIN
================================================== */

async function doLogin(){

  try{

    const d =
      await api(
        "/api/login",
        {
          method:"POST",
          body:{
            login:
              $("login").value,
            password:
              $("pass").value
          }
        }
      );

    token = d.token;

    localStorage.setItem(
      "black_token",
      token
    );

    close();

    await refresh();

  }catch(e){

    alert(e.message);

  }
}

/* ==================================================
   LOGOUT
================================================== */

async function logout(){

  try{

    if(token){

      await api(
        "/api/logout",
        {
          method:"POST"
        }
      );
    }

  }catch(e){}

  token = "";

  localStorage.removeItem(
    "black_token"
  );

  $("hello").textContent = "";

  $("loginBtn")
    .classList
    .remove("hide");

  $("regBtn")
    .classList
    .remove("hide");

  $("logoutBtn")
    .classList
    .add("hide");

  $("adminSection")
    .classList
    .add("hide");

  $("navAdmin")
    .classList
    .add("hide");

  $("profile").innerHTML = `
    <p class="muted">
      Đăng nhập để xem hồ sơ.
    </p>
  `;

  await loadOrders();
}

/* ==================================================
   REFRESH USER
================================================== */

async function refresh(){

  await loadProducts();

  if(!token){

    return;
  }

  try{

    const u =
      await api("/api/me");

    $("hello").textContent =
      `👤 ${u.username} · ${money(u.balance)}`;

    $("loginBtn")
      .classList
      .add("hide");

    $("regBtn")
      .classList
      .add("hide");

    $("logoutBtn")
      .classList
      .remove("hide");

    $("profile").innerHTML = `

      <div class="row">
        <span>Tài khoản</span>
        <b>${esc(u.username)}</b>
      </div>

      <div class="row">
        <span>Liên hệ</span>
        <b>${esc(u.contact)}</b>
      </div>

      <div class="row">
        <span>Số dư</span>
        <b>${money(u.balance)}</b>
      </div>

      <div class="row">
        <span>Quyền</span>
        <b>
          ${
            u.role === "admin"
              ? "👑 ADMIN"
              : "👤 USER"
          }
        </b>
      </div>

      <br>

      <button
        class="danger"
        onclick="logout()">
        Đăng xuất
      </button>

    `;

    if(u.role === "admin"){

      $("adminSection")
        .classList
        .remove("hide");

      $("navAdmin")
        .classList
        .remove("hide");

      await loadAdmin();

    }else{

      $("adminSection")
        .classList
        .add("hide");

      $("navAdmin")
        .classList
        .add("hide");
    }

    await loadOrders();

  }catch(e){

    await logout();

  }
}

/* ==================================================
   BUY
================================================== */

function buy(id){

  if(!token){

    modal("login");
    return;
  }

  const p =
    products.find(
      x => x.id === id
    );

  if(!p){

    alert(
      "Không tìm thấy sản phẩm."
    );

    return;
  }

  let qty = 1;

  $("modalbox").innerHTML = `

    <h3>
      🛒 Mua ${esc(p.name)}
    </h3>

    <b>Số lượng</b>

    <div
      style="
        display:flex;
        justify-content:center;
        align-items:center;
        gap:18px;
        margin:15px 0;
      ">

      <button
        class="dark"
        id="qtyMinus">
        −
      </button>

      <strong
        id="qtyValue"
        style="font-size:22px">
        1
      </strong>

      <button
        class="dark"
        id="qtyPlus">
        +
      </button>

    </div>

    <b>
      🎮 Tên tài khoản game
    </b>

    <input
      id="gameUsername"
      placeholder="Nhập tên tài khoản game">

    <p class="muted">
      Tổng tiền:
      <b id="buyTotal">
        ${money(p.price)}
      </b>
    </p>

    <button
      class="primary"
      id="confirmBuy"
      style="width:100%">
      Xác nhận mua
    </button>

    <button
      class="dark"
      id="cancelBuy"
      style="width:100%;margin-top:8px">
      Hủy
    </button>
  `;

  $("modal")
    .classList
    .add("show");

  function updateQty(){

    $("qtyValue")
      .textContent = qty;

    $("buyTotal")
      .textContent =
      money(
        p.price * qty
      );
  }

  $("qtyMinus").onclick = () => {

    if(qty > 1){

      qty--;
      updateQty();

    }
  };

  $("qtyPlus").onclick = () => {

    if(
      p.stock > 0 &&
      qty >= p.stock
    ){

      alert(
        "Không đủ hàng."
      );

      return;
    }

    qty++;
    updateQty();
  };

  $("cancelBuy").onclick =
    () => close();

  $("confirmBuy").onclick =
    () => {

      const gameUsername =
        $("gameUsername")
          .value
          .trim();

      if(!gameUsername){

        alert(
          "Vui lòng nhập tên tài khoản game."
        );

        return;
      }

      checkout(
        [
          {
            productId:id,
            qty
          }
        ],
        gameUsername
      );
    };
}

/* ==================================================
   CHECKOUT
================================================== */

async function checkout(
  items,
  gameUsername
){

  try{

    const d =
      await api(
        "/api/orders",
        {
          method:"POST",
          body:{
            items,
            gameUsername
          }
        }
      );

    alert(
      "Đặt hàng thành công. Mã đơn #" +
      d.orderId
    );

    close();

    await refresh();

  }catch(e){

    alert(e.message);
  }
}

/* ==================================================
   ORDERS
================================================== */

async function loadOrders(){

  if(!token){

    $("orders").innerHTML =
      `<p class="muted">
        Đăng nhập để xem đơn hàng.
      </p>`;

    return;
  }

  try{

    const a =
      await api(
        "/api/orders?ts=" +
        Date.now()
      );

    $("orders").innerHTML =
      a.map(o => `

        <div class="row">

          <span>

            <b>
              #${o.id}
            </b>

            · ${esc(o.game_username || "")}

            <br>

            <small class="muted">

              ${
                o.items
                  .map(
                    x =>
                    `${esc(x.name)} x${x.qty}`
                  )
                  .join(", ")
              }

              <br>

              ${esc(o.status)}

            </small>

          </span>

          <b>
            ${money(o.total)}
          </b>

        </div>

      `).join("")

      ||

      `<p class="muted">
        Chưa có đơn.
      </p>`;

  }catch(e){

    console.error(e);

  }
}

/* ==================================================
   CARD TOPUP
================================================== */

function topupCard(){

  if(!token){

    modal("login");
    return;
  }

  $("topupMsg").innerHTML = `

    <div
      class="panel"
      style="padding:15px">

      <h3>
        💳 Nạp thẻ cào
      </h3>

      <p class="muted">
        Chiết khấu 16%.
      </p>

      <select id="cp">

        <option value="Viettel">
          Viettel
        </option>

        <option value="Vinaphone">
          Vinaphone
        </option>

        <option value="Mobifone">
          Mobifone
        </option>

      </select>

      <select id="cv">

        ${
          [
            10000,
            20000,
            50000,
            100000,
            200000,
            500000
          ]
          .map(
            x =>
            `<option value="${x}">
              ${money(x)}
            </option>`
          )
          .join("")
        }

      </select>

      <input
        id="cs"
        placeholder="Serial">

      <input
        id="cc"
        placeholder="Mã thẻ">

      <button
        class="primary"
        onclick="sendCard()">
        Gửi thẻ
      </button>

      <p class="muted">
        Admin sẽ kiểm tra thẻ.
      </p>

    </div>

/* ==================================================
   BANK QR
================================================== */

let currentBankInfo = null;

async function selectBankAmount(amount){

  try{

    if(!currentBankInfo){

      currentBankInfo =
        await api(
          "/api/bank-info"
        );
    }

    if(amount < 10000){

      alert(
        "Tối thiểu 10.000đ."
      );

      return;
    }

    $("bankAmount").value =
      amount;

    const b =
      currentBankInfo;

    let qr = "";

    if(b.qrUrl){

      qr =
        b.qrUrl
          .replaceAll(
            "{amount}",
            String(amount)
          );

    }else if(
      b.bankId &&
      b.account
    ){

      qr =
        `https://img.vietqr.io/image/` +
        `${encodeURIComponent(b.bankId)}` +
        `-${encodeURIComponent(b.account)}` +
        `-compact2.png?amount=${amount}` +
        `&addInfo=${encodeURIComponent(
          "NAP " + amount
        )}` +
        `&accountName=${encodeURIComponent(
          b.accountName || ""
        )}`;

    }

    $("bankInfoBox").innerHTML = `

      <div class="qr-box">

        ${
          qr
          ? `
            <img
              src="${qr}"
              alt="QR Bank">
          `
          : `
            <p class="muted">
              Chưa có QR.
            </p>
          `
        }

        <p>
          Ngân hàng:
          <b>${esc(b.bankId)}</b>
        </p>

        <p>
          STK:
          <b>${esc(b.account)}</b>
        </p>

        <p>
          Chủ TK:
          <b>${esc(b.accountName)}</b>
        </p>

        <p>
          Số tiền:
          <b>${money(amount)}</b>
        </p>

        <button
          class="primary"
          onclick="createBankTopup()">
          ✅ Tôi đã chuyển khoản
        </button>

      </div>
    `;

  }catch(e){

    alert(e.message);

  }
}

/* ==================================================
   READ IMAGE
================================================== */

function readImage(file){

  return new Promise(
    (resolve,reject) => {

      if(!file){
        resolve(null);
        return;
      }

      if(!file.type.startsWith("image/")){

        reject(
          new Error(
            "File phải là hình ảnh."
          )
        );

        return;
      }

      const reader =
        new FileReader();

      reader.onload =
        () => resolve(
          reader.result
        );

      reader.onerror =
        () => reject(
          new Error(
            "Không đọc được ảnh."
          )
        );

      reader.readAsDataURL(file);
    }
  );
}

/* ==================================================
   ADD PRODUCT
================================================== */

async function addProduct(){

  try{

    const name =
      $("newName")
        .value
        .trim();

    const price =
      Number(
        $("newPrice").value
      );

    const stock =
      Number(
        $("newStock").value
      ) || 0;

    const file =
      $("newImage").files[0];

    const image =
      await readImage(file);

    if(!name){

      alert(
        "Nhập tên sản phẩm."
      );

      return;
    }

    if(
      !Number.isFinite(price) ||
      price <= 0
    ){

      alert(
        "Giá không hợp lệ."
      );

      return;
    }

    await api(
      "/api/admin/products",
      {
        method:"POST",
        body:{
          name,
          price,
          stock,
          image
        }
      }
    );

    alert(
      "✅ Đã thêm sản phẩm."
    );

    await loadProducts();
    await loadAdmin();

  }catch(e){

    alert(e.message);

  }
}

/* ==================================================
   SAVE PRODUCT
   SỬA GIÁ + ẢNH
================================================== */

async function saveProduct(id){

  try{

    const name =
      $("pn_" + id)
        .value
        .trim();

    const price =
      Number(
        $("pp_" + id).value
      );

    const stock =
      Number(
        $("ps_" + id).value
      );

    const file =
      $("pi_" + id).files[0];

    let image;

    /*
      Không chọn ảnh mới:
      image = undefined
      => server giữ ảnh cũ.

      Chọn ảnh:
      => server lưu ảnh mới.
    */

    if(file){

      image =
        await readImage(file);
    }

    const body = {
      name,
      price,
      stock
    };

    if(image !== undefined){
      body.image = image;
    }

    const d =
      await api(
        `/api/admin/products/${id}`,
        {
          method:"PATCH",
          body
        }
      );

    /*
      Cực kỳ quan trọng:
      lấy lại dữ liệu từ DB.
    */

    await loadProducts();
    await loadAdmin();

    alert(
      "✅ Đã lưu. User sẽ thấy giá/ảnh mới."
    );

  }catch(e){

    alert(e.message);

  }
}

        ? `
          <p>
            Đã cộng:

async function approveTopup(id){

  const amount =
    prompt(
      "Nhập số tiền muốn cộng vào tài khoản:",
      ""
    );

  if(amount === null){
    return;
  }

  const creditedAmount =
    Number(amount);

  if(
    !Number.isFinite(
      creditedAmount
    ) ||
    creditedAmount <= 0
  ){

    alert(
      "Số tiền không hợp lệ."
    );

    return;
  }

  try{

    await api(
      `/api/admin/topups/${id}/approve`,
      {
        method:"POST",
        body:{
          creditedAmount
        }
      }
    );

    alert(
      "✅ Đã duyệt và cộng tiền."
    );

    await loadAdmin();

  }catch(e){

    alert(e.message);

  }
}
