<!doctype html>
<html lang="vi">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>BLACK GAG2 SHOP</title>

<style>

*{
 box-sizing:border-box
}

body{
 margin:0;
 background:#080a13;
 color:white;
 font-family:Arial
}

.wrap{
 max-width:1100px;
 margin:auto;
 padding:20px 15px 100px
}


header{
 position:sticky;
 top:0;
 background:#0b0d18ee;
 z-index:5;
 border-bottom:1px solid #292d48
}


.nav{
 display:flex;
 align-items:center;
 gap:10px;
 padding:15px;
 max-width:1100px;
 margin:auto;
}


.logo{
 font-size:22px;
 font-weight:900;
 margin-right:auto
}

.logo span{
 color:#8b6cff
}


button{

 border:0;
 border-radius:12px;
 padding:12px;
 cursor:pointer;
 font-weight:bold;

}


.primary{

 background:linear-gradient(90deg,#6657ff,#d96cff);
 color:white;

}


.dark{

 background:#171a2c;
 color:white;
 border:1px solid #303451;

}



.card,
.panel,
.hero{

 background:#10121e;
 border:1px solid #292d48;
 border-radius:20px;

}


.hero{

 padding:35px;

}


.grad{

 background:linear-gradient(90deg,#7667ff,#d96cff);
 color:transparent;
 background-clip:text;

}



.grid{

 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:15px;

}



.card{

 padding:15px;

}


.product-img{

 width:100%;
 height:170px;
 object-fit:cover;
 border-radius:15px;

}



.price{

 font-size:20px;
 font-weight:900;
 margin:10px 0;

}



input,select{

 width:100%;
 padding:12px;
 margin:7px 0;

 background:#0b0d17;
 color:white;

 border:1px solid #303451;
 border-radius:10px;

}



.hide{
 display:none!important
}



.modal{

 position:fixed;
 inset:0;
 background:#000b;
 display:none;
 justify-content:center;
 align-items:center;
 padding:20px;
 z-index:20;

}



.modal.show{

 display:flex;

}



.box{

 background:#111426;
 border:1px solid #383c64;
 padding:20px;
 border-radius:20px;
 width:420px;

}



.bottom{

 position:fixed;
 bottom:10px;
 left:50%;
 transform:translateX(-50%);

 width:95%;
 max-width:700px;

 display:grid;
 grid-template-columns:repeat(5,1fr);

 background:#0d0f1a;
 border:1px solid #292d48;

 padding:8px;
 border-radius:18px;

}



.bottom button{

 background:none;
 color:#aaa;

}



.on{

 background:#29214e!important;
 color:white!important;

}


</style>

</head>


<body>


<header>

<div class="nav">


<div class="logo">
🎮 <span>BLACK</span> GAG2 SHOP
</div>


<span id="hello"></span>


<button id="loginBtn"
class="dark"
onclick="openLogin()">
Đăng nhập
</button>


<button id="regBtn"
class="primary"
onclick="openRegister()">
Đăng ký
</button>


<button id="logoutBtn"
class="dark hide"
onclick="logout()">
Thoát
</button>


</div>

</header>



<main class="wrap">


<section class="hero">

<h1>
BLACK GAG2 SHOP
</h1>


<p>
Grow A Garden 2
</p>


<button class="primary"
onclick="loadProducts()">
🛒 Xem shop
</button>


</section>




<section>

<h2>
🌱 Sản phẩm
</h2>


<div id="products"
class="grid">
</div>


</section>





<section class="panel"
style="padding:20px">


<h2>
👤 Hồ sơ
</h2>


<div id="profile">
Đăng nhập để xem
</div>


</section>




<section class="panel"
style="padding:20px">


<h2>
📜 Lịch sử
</h2>


<div id="history">
</div>


</section>



<section id="admin"
class="panel hide"
style="padding:20px">


<h2>
👑 ADMIN
</h2>


<div id="adminBox">
</div>


</section>



</main>




<div class="modal"
id="modal">


<div class="box"
id="box">

</div>


</div><script>

let token = localStorage.getItem("black_token") || "";

let products=[];


function money(n){

return Number(n)
.toLocaleString("vi-VN")+"đ";

}



async function api(url,opt={}){


opt.headers={
...(opt.headers||{}),
...(token?
{
Authorization:"Bearer "+token
}:{})

};



if(opt.body){

opt.headers["Content-Type"]="application/json";

opt.body=
JSON.stringify(opt.body);

}


let r =
await fetch(url,opt);


let d =
await r.json()
.catch(()=>({}));


if(!r.ok)
throw Error(d.error||"Lỗi");


return d;

}



/* =====================
   LOAD PRODUCT
===================== */


async function loadProducts(){


products =
await api("/api/products");



document.getElementById("products")
.innerHTML =

products.map(p=>`

<div class="card">


${p.image?
`
<img class="product-img"
src="${p.image}">
`
:""}



<h3>
${p.name}
</h3>


<p>
Grow A Garden 2
</p>


<div class="price">

${money(p.price)}

</div>



<button class="primary"
onclick="buy(${p.id})">

Mua

</button>


</div>


`).join("");


}




/* =====================
LOGIN
===================== */


function openLogin(){


box.innerHTML=`

<h2>Đăng nhập</h2>


<input id="login"
placeholder="Tên hoặc email">


<input id="password"
type="password"
placeholder="Mật khẩu">


<button class="primary"
style="width:100%"
onclick="login()">

Đăng nhập

</button>


`;


modal.classList.add("show");


}



async function login(){


try{


let d =
await api("/api/login",{

method:"POST",

body:{

login:
document.getElementById("login").value,


password:
document.getElementById("password").value

}

});



token=d.token;


localStorage.setItem(
"black_token",
token
);



close();

refresh();


}catch(e){

alert(e.message);

}


}




/* =====================
REGISTER
===================== */


function openRegister(){


box.innerHTML=`

<h2>Tạo tài khoản</h2>


<input id="username"
placeholder="Tên tài khoản">


<input id="contact"
placeholder="Email / SĐT">


<input id="password"
type="password"
placeholder="Mật khẩu">


<button class="primary"
style="width:100%"
onclick="register()">

Đăng ký

</button>

`;

modal.classList.add("show");


}



async function register(){


try{


let d =
await api("/api/register",{

method:"POST",

body:{

username:
username.value,

contact:
contact.value,

password:
password.value

}

});


token=d.token;


localStorage.setItem(
"black_token",
token
);



close();

refresh();


}catch(e){

alert(e.message);

}



}




function close(){

modal.classList.remove("show");

}




/* =====================
LOGOUT
===================== */


async function logout(){


token="";


localStorage.removeItem(
"black_token"
);


location.reload();


}



/* =====================
REFRESH USER
===================== */


async function refresh(){


if(!token)
return;



try{


let u =
await api("/api/me");



hello.innerHTML =
"👤 "+u.username+
" | "+
money(u.balance);



loginBtn.classList.add("hide");

regBtn.classList.add("hide");

logoutBtn.classList.remove("hide");



profile.innerHTML=`

<p>
<b>Tài khoản:</b>
${u.username}
</p>


<p>
<b>Liên hệ:</b>
${u.contact}
</p>


<p>
<b>Số dư:</b>
${money(u.balance)}
</p>


<p>
<b>Quyền:</b>
${u.role}
</p>

`;



if(u.role==="admin"){

admin.classList.remove("hide");

loadAdmin();

}



loadHistory();


}catch(e){

logout();

}


}




/* =====================
BUY
===================== */


async function buy(id){


let p =
products.find(x=>x.id===id);



let qty =
prompt(
"Số lượng:",
"1"
);



if(!qty)
return;



let game =
prompt(
"Tên tài khoản game:"
);



if(!game)
return;




try{


let d =
await api("/api/orders",{

method:"POST",

body:{

gameUsername:game,

items:[{

productId:id,

qty:Number(qty)

}]

}

});



alert(
"Mua thành công #"+d.orderId
);


refresh();



}catch(e){

alert(e.message);

}



}




/* =====================
HISTORY
===================== */


async function loadHistory(){


let o =
await api("/api/orders");



history.innerHTML =
o.map(x=>`

<div>

Đơn #${x.id}

-
${money(x.total)}

-
${x.status}

</div>

`).join("")

||"Chưa có";


}


loadProducts();

refresh();


</script><script>


/* =====================
   BANK TOPUP
===================== */


async function bank(){


if(!token){

openLogin();
return;

}



let amount =
prompt(
"Nhập mệnh giá:\n10000\n20000\n50000\n100000"
);



if(!amount)
return;



let info =
await api("/api/bank-info");



let qr =
info.qrs[amount];



if(!qr){

alert("Không có QR mệnh giá này");

return;

}



box.innerHTML=`

<h2>🏦 Nạp Bank</h2>


<p>
Số tiền:
<b>${money(amount)}</b>
</p>


<img
src="${qr}"
style="
width:260px;
background:white;
padding:10px;
border-radius:15px
">


<p>
STK:
${info.account}
</p>


<p>
Tên:
${info.name}
</p>



<button class="primary"
onclick="sendBank(${amount})">

Đã chuyển khoản

</button>


`;

modal.classList.add("show");


}



async function sendBank(amount){


await api("/api/topups/bank",{

method:"POST",

body:{
amount
}

});


alert(
"Đã gửi yêu cầu nạp"
);


close();


}





/* =====================
ADMIN
===================== */


async function loadAdmin(){


let d =
await api("/api/admin/overview");



adminBox.innerHTML=`

<h3>👥 User</h3>

${d.users.map(u=>`

<div>

${u.username}

-
${money(u.balance)}

</div>

`).join("")}



<hr>


<h3>🌱 Sản phẩm</h3>


${d.products.map(p=>`

<div>

${p.name}

<br>

Giá:
${money(p.price)}


<button onclick="
editProduct(
${p.id},
'${p.name}',
${p.price},
${p.stock},
'${p.image||""}'
)
">

Sửa

</button>


</div>


`).join("")}




<hr>


<h3>💳 Duyệt nạp</h3>


${d.topups.map(t=>`

<div>

${t.username}

-

${t.method}

-

${money(t.amount)}

-

${t.status}



<button onclick="
approve(${t.id})
">

Duyệt

</button>



<button onclick="
reject(${t.id})
">

Sai thẻ

</button>


</div>


`).join("")}



<hr>


<h3>
➕ Cộng tiền user
</h3>


<input id="addUser"
placeholder="Tên user">


<input id="addMoney"
placeholder="Số tiền">


<button onclick="addMoney()">

Cộng

</button>


`;

}




/* =====================
EDIT PRODUCT
===================== */


function editProduct(
id,
name,
price,
stock,
image
){



let n =
prompt(
"Tên:",
name
);



let p =
prompt(
"Giá:",
price
);



let img =
prompt(
"Link ảnh:",
image
);



updateProduct(
id,
n,
p,
stock,
img
);


}




async function updateProduct(
id,
name,
price,
stock,
image
){


await api(
"/api/admin/products/"+id,
{

method:"PATCH",

body:{
name,
price:Number(price),
stock:Number(stock),
image
}

});


alert("Đã sửa");


loadProducts();

loadAdmin();


}





/* =====================
APPROVE TOPUP
===================== */


async function approve(id){


await api(
"/api/admin/topups/"+id+"/approve",
{
method:"POST"
}
);


alert(
"Đã cộng tiền"
);


loadAdmin();


}




async function reject(id){


await api(
"/api/admin/topups/"+id+"/reject",
{
method:"POST"
}
);


alert(
"Đã từ chối"
);


loadAdmin();


}





/* =====================
ADD MONEY
===================== */


async function addMoney(){


await api(
"/api/admin/add-money",
{

method:"POST",

body:{

username:
addUser.value,


amount:
Number(addMoney.value)

}

});


alert(
"Đã cộng"
);


loadAdmin();


}


</script>


<nav class="bottom">

<button class="on"
onclick="loadProducts()">
🏠<br>Shop
</button>


<button onclick="bank()">
🏦<br>Bank
</button>


<button onclick="loadHistory()">
📜<br>Lịch sử
</button>


<button onclick="
profile.scrollIntoView()
">
👤<br>Hồ sơ
</button>


<button onclick="
admin.scrollIntoView()
">
👑<br>Admin
</button>

</nav>


</body>
</html>
